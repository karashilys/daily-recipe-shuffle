name: Release

# v で始まるタグ(例: v0.1.0)をpushすると、検証を通したjarをGitHub Releaseに添付する
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Releaseの作成に必要
    steps:
      # actions はタグの付け替えによる差し替えを防ぐため、コミットSHAで固定する(更新はDependabot)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # リリースではキャッシュを読むだけにする
          cache-read-only: true

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "タグ '$TAG' は v<メジャー>.<マイナー>.<パッチ> の形式ではない" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # コンパイル、単体テスト(JUnit)、リリース用jarの作成
      - name: Build and unit test
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

      # 実サーバー検証(仕様書10.2, 10.3)。FAILならリリースしない。
      # -PacceptEula=true により、Paperのコマンドライン同意フラグでMinecraftのEULA
      # (https://aka.ms/MinecraftEULA)に同意したうえでサーバーを起動する。
      - name: Server test
        run: ./gradlew serverTest -PacceptEula=true -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          JAR: build/libs/daily-recipe-shuffle-${{ steps.version.outputs.version }}.jar
        run: |
          test -f "$JAR"
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            run/plugins/DailyRecipeShuffleTest/report.txt
            run/logs/latest.log
            build/reports/tests/
          if-no-files-found: ignore
